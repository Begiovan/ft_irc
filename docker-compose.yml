services:
  ft-irc:
    build:
      context: .
      dockerfile: Dockerfile
    image: ft-irc:local
    container_name: ft_irc
    restart: unless-stopped
    ports:
      - "${IRC_EXTERNAL_PORT:-6667}:${IRC_PORT:-6667}/tcp"
    environment:
      IRC_PORT: "${IRC_PORT:-6667}"
      IRC_PASS: "${IRC_PASS:?Set IRC_PASS in .env}"
